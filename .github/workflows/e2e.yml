name: E2E Smoke (software-clones)

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - markdown
          - apiclient
          - tvtime
          - excalidraw
          - photopea
          - it-tools
          - kanban
          - glance
          - kener
          - memos
          - lofi
          - nonio
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ${{ matrix.app }}/client/package-lock.json

      - name: Install E2E deps
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Install app client deps
        run: npm --prefix ${{ matrix.app }}/client ci

      - name: Run E2E for ${{ matrix.app }}
        run: npx playwright test --project=${{ matrix.app }}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ matrix.app }}
          path: playwright-report/
          retention-days: 7

  # 文档/结构一致性闸门：不依赖任何 app 的 npm install，仅用 Node 内置模块运行校验器，
  # 在 PR 阶段即可拦截「新增 App 却忘了写文档 / 漏登 CI 矩阵」之类的漂移。
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run full verification (checker + rules tests + catalog freshness)
        run: node scripts/verify-all.mjs
      - name: Ensure catalog is up to date
        run: |
          node scripts/gen-catalog.mjs
          git diff --exit-code docs/APP_CATALOG.md || (echo "docs/APP_CATALOG.md 过期，请运行 node scripts/gen-catalog.mjs 后重新提交" && exit 1)
